name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NEXMC.sln

      - name: Build
        run: dotnet build NEXMC.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/NEXMC.Tests/NEXMC.Tests.csproj -c Release --no-build
